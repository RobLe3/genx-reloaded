  <desc id="description">A GenX Reloaded podcast player card. Click anywhere on the card to open the 21-minute audio episode.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.55" stop-color="#f7f0df"/>
      <stop offset="1" stop-color="#efe3ca"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
