      <rect x="198" y="0" width="5" height="40" rx="2.5"/><rect x="209" y="9" width="5" height="22" rx="2.5" opacity="0.72"/>
      <rect x="220" y="5" width="5" height="30" rx="2.5" opacity="0.82"/><rect x="231" y="14" width="5" height="12" rx="2.5" opacity="0.62"/>
      <rect x="242" y="7" width="5" height="26" rx="2.5" opacity="0.78"/><rect x="253" y="2" width="5" height="36" rx="2.5" opacity="0.9"/>
